const Separator = (v = false, cls = '') => `<div class="${cx('shrink-0 bg-border', v ? 'h-4 w-px' : 'h-px w-full', cls)}" role="none"></div>`;

const Input = (id, { type = 'text', ph = '', value = '', cls = '', req = false, extra = '' } = {}) =>
  `<input id="${id}" type="${type}" ${req ? 'required' : ''} value="${esc(value)}" placeholder="${esc(ph)}" ${extra} class="${cx('flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm shadow-sm transition-colors placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring', cls)}">`;
const Label = (forId, text) => `<label for="${forId}" class="text-sm font-medium leading-none">${text}</label>`;
const Select = (id, options) => `<div class="relative"><select id="${id}" class="flex h-9 w-full appearance-none rounded-md border border-input bg-transparent px-3 py-1 pr-8 text-sm shadow-sm focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring">${options.map(o => `<option>${o}</option>`).join('')}</select>${icon('chevron-down', 'absolute right-2.5 top-2.5 size-4 opacity-50')}</div>`;
const Checkbox = (id, checked, extra = '') => `<button type="button" role="checkbox" id="${id}" aria-checked="${checked}" ${extra} class="${cx('peer grid size-4 shrink-0 place-items-center rounded-sm border border-primary shadow focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring', checked === true ? 'bg-primary text-primary-foreground' : checked === 'mixed' ? 'bg-primary text-primary-foreground' : '')}">${checked === true ? icon('check', 'size-3.5') : checked === 'mixed' ? icon('minus', 'size-3.5') : ''}</button>`;

const Tabs = (items, current, act, cls = '') => `<div role="tablist" class="${cx('inline-flex h-9 items-center justify-center rounded-lg bg-muted p-1 text-muted-foreground', cls)}">${items.map(([k, l, n]) => `<button type="button" role="tab" aria-selected="${current === k}" data-act="${act}" data-key="${k}" class="${cx('inline-flex items-center justify-center gap-1.5 whitespace-nowrap rounded-md px-3 py-1 text-sm font-medium transition-all focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring', current === k ? 'bg-background text-foreground shadow' : 'hover:text-foreground')}">${l}${n !== undefined ? `<span class="${cx('flex h-5 min-w-5 items-center justify-center rounded-full px-1 text-xs tabular-nums', current === k ? 'bg-muted-foreground/30' : 'bg-muted-foreground/20')}">${n}</span>` : ''}</button>`).join('')}</div>`;

const Avatar = (initials, cls = 'size-8') => `<span class="${cx('relative flex shrink-0 items-center justify-center overflow-hidden rounded-lg bg-muted text-xs font-medium', cls)}">${initials}</span>`;

const Alert = (ic, title, desc, variant = 'default', action = '') => `<div role="alert" class="${cx('relative flex w-full items-start gap-3 rounded-lg border px-4 py-3 text-sm', variant === 'warn' ? 'border-warn/50 text-warn' : variant === 'destructive' ? 'border-destructive/50 text-destructive' : 'bg-background text-foreground')}">${icon(ic, 'mt-0.5 size-4')}<div class="min-w-0 flex-1"><h5 class="mb-1 font-medium leading-none tracking-tight">${title}</h5><div class="text-sm ${variant === 'default' ? 'text-muted-foreground' : 'opacity-90'}">${desc}</div></div>${action}</div>`;

const Progress = (pct, cls = 'bg-primary') => `<div class="relative h-2 w-full overflow-hidden rounded-full bg-primary/20"><div class="h-full ${cls} transition-all" style="width:${pct}%"></div></div>`;

const toast = (title, desc = '') => {
  const el = document.createElement('li');
  el.className = 'toast-in flex items-start gap-3 rounded-lg border bg-popover p-4 text-popover-foreground shadow-lg';
  el.innerHTML = `${icon('circle-check', 'mt-0.5 size-4 text-foreground')}<div class="grid gap-1"><div class="text-[13px] font-medium leading-tight">${esc(title)}</div>${desc ? `<div class="text-[13px] leading-snug text-muted-foreground">${esc(desc)}</div>` : ''}</div>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 4000);
};

    <div class="mt-auto p-2">

  <div class="flex flex-col gap-2 p-2">

const roleTabs = () => `<div role="tablist" aria-label="Ansicht" class="inline-flex h-8 items-center rounded-lg bg-muted p-[3px] text-muted-foreground">${[['admin', 'Admin'], ['kunde', 'Kunde']].map(([k, l]) => `<button type="button" role="tab" aria-selected="${state.role === k}" data-act="role" data-key="${k}" class="${cx('inline-flex h-full items-center rounded-md px-2.5 text-xs font-medium transition-all', state.role === k ? 'bg-background text-foreground shadow' : 'hover:text-foreground')}">${l}</button>`).join('')}</div>`;

const crumb = (items) => items.map((it, n) => n < items.length - 1
  ? `<button type="button" data-act="nav" data-key="${it[1]}" class="transition-colors hover:text-foreground">${it[0]}</button>${icon('chevron-right', 'size-3.5')}`

// ---------- Übersicht ----------
const sectionCard = (desc, value, trend, l1, l1ic, l2) => `
  <div class="rounded-xl border bg-gradient-to-t from-primary/[0.04] to-card text-card-foreground shadow-sm dark:bg-card">
    <div class="relative flex flex-col gap-1.5 p-6 pb-0">
      <p class="text-sm text-muted-foreground">${desc}</p>
      <div class="text-2xl font-semibold tabular-nums leading-none tracking-tight lg:text-3xl">${value}</div>
      <div class="absolute right-6 top-6">${trend}</div>
    </div>
    <div class="flex flex-col items-start gap-1.5 p-6 pt-5 text-sm">
      <div class="flex items-center gap-2 font-medium leading-none">${l1}${icon(l1ic, 'size-4')}</div>
      <div class="text-muted-foreground">${l2}</div>
    </div>
  </div>`;

const areaChart = () => {
  const W = 640, H = 220, max = 10, pts = months.map(([, v], i) => [i / (months.length - 1) * W, H - v / max * H]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = line + ` L${W} ${H} L0 ${H} Z`;
  return `
    <div class="relative">
      <div class="relative h-[220px] w-full">
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="absolute inset-0 h-full w-full overflow-visible" role="img" aria-label="Aktive Kunden von Juni bis November 2026, von 2 auf 7">
          <defs><linearGradient id="fillArea" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stop-color="hsl(var(--chart-1))" stop-opacity="0.22"/><stop offset="95%" stop-color="hsl(var(--chart-1))" stop-opacity="0.02"/></linearGradient></defs>
          ${[0.25, 0.5, 0.75].map(f => `<line x1="0" x2="${W}" y1="${H * f}" y2="${H * f}" stroke="hsl(var(--border))" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>`).join('')}
          <path d="${area}" fill="url(#fillArea)"/>
          <path d="${line}" fill="none" stroke="hsl(var(--chart-1))" stroke-width="2" vector-effect="non-scaling-stroke"/>
        </svg>
        ${pts.map((p, i) => `<span class="group absolute -translate-x-1/2 -translate-y-1/2" style="left:${p[0] / W * 100}%;top:${p[1] / H * 100}%"><span class="block size-2.5 rounded-full border-2 border-background bg-[hsl(var(--chart-1))] ${i === pts.length - 1 ? '' : 'opacity-0 group-hover:opacity-100'}"></span><span class="pointer-events-none absolute bottom-4 left-1/2 hidden -translate-x-1/2 whitespace-nowrap rounded-lg border bg-background px-2.5 py-1.5 text-xs shadow-xl group-hover:block"><span class="font-medium">${months[i][0]} 2026</span><span class="ml-2 font-mono tabular-nums text-muted-foreground">${months[i][1]}</span></span></span>`).join('')}
      </div>
      <div class="mt-3 flex justify-between text-xs text-muted-foreground">${months.map(([m]) => `<span>${m}</span>`).join('')}</div>
    </div>`;
};

const SSTAT = {
  ok: ['circle-check', 'text-ok', 'Läuft'],
  platte: ['hard-drive', 'text-warn', 'Platte fast voll'],
  neustart: ['power', 'text-warn', 'Neustart fällig'],
  neu: ['loader-circle', 'text-info animate-spin', 'Wird angelegt'],
};
const serverBadge = sv => { const [ic, c, l] = SSTAT[serverStatus(sv)]; return badge(`${icon(ic, 'size-3.5 ' + c)}${l}`, 'outline', 'px-1.5 text-muted-foreground font-medium'); };
const serverAlerts = () => servers.filter(sv => serverStatus(sv) !== 'ok' && serverStatus(sv) !== 'neu').map(sv => serverStatus(sv) === 'platte'
  ? Alert('hard-drive', `${esc(sv.kunde)}: Platte zu ${sv.disk} % belegt`, 'Der Agent meldet wenig Platz; das letzte Backup ist deshalb fehlgeschlagen. Größeren Server-Typ wählen oder alte Daten aufräumen.', 'warn', button('Server ansehen', { variant: 'outline', size: 'sm', act: 'server-detail', data: `data-key="${sv.id}"`, cls: 'text-foreground' }))
  : Alert('power', `${esc(sv.kunde)}: Neustart fällig`, `${sv.updates} Sicherheitsupdates eingespielt, darunter der Kernel. Neustart im Wartungsfenster heute 03:30; betrifft ${kundenOf(sv).length} Kunden: ${kundenOf(sv).join(', ')}.`, 'default', button('Server ansehen', { variant: 'outline', size: 'sm', act: 'server-detail', data: `data-key="${sv.id}"` }))).join('');

const viewUebersicht = () => {
  const haben = instances.filter(i => i.produkt === ROLLOUT.produkt && i.status !== 'nurlesen');
  const svOk = servers.filter(sv => serverStatus(sv) === 'ok').length;
  const nProd = k => instances.filter(i => i.produkt === k).length;
  const warnungen = servers.filter(sv => !['ok', 'neu'].includes(serverStatus(sv))).length + instances.filter(i => i.status === 'warnung').length;
  const events = [
    ['archive', 'Backups', `${instances.filter(i => i.backupOk).length} von ${instances.length} erfolgreich`, '03:21'],
    ['triangle-alert', 'Studio Lind', 'Backup fehlgeschlagen, Platte zu 91 % belegt', '03:15'],
    ['power', 'Gemeinsamer Server 2', 'Kernel-Update, Neustart im Wartungsfenster', '02:10'],
    ['refresh-cw', 'Update-Welle 2', 'Schreinerei Holm: Haben 1.9.0', 'gestern'],
  ];
  return `
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4">
      ${sectionCard('Server', servers.length, badge(`${svOk}/${servers.length} ok`, 'outline', 'font-medium tabular-nums'), `${servers.filter(x => x.art === 'gemeinsam').length} gemeinsam, ${servers.filter(x => x.art === 'eigen').length} eigen, ${servers.filter(x => x.art === 'kunde').length} beim Kunden`, 'hard-drive', 'Debian 13, Sicherheitsupdates automatisch')}
      ${sectionCard('Installationen', instances.length, badge(`${Object.keys(PRODUKTE).filter(k => nProd(k)).length} Produkte`, 'outline', 'font-medium'), Object.entries(PRODUKTE).filter(([k]) => nProd(k)).map(([k, m]) => `${m.name} ${nProd(k)}`).join(', '), 'boxes', 'Jedes Produkt mit eigenem Manifest')}
      ${sectionCard('Warnungen', warnungen, badge(icon('triangle-alert', 'size-3 text-warn') + 'prüfen', 'outline', 'font-medium'), 'Studio Lind: Platte und Backup', 'arrow-right', 'Gemeinsamer Server 2: Neustart fällig')}
      ${sectionCard(`${PRODUKTE[ROLLOUT.produkt].name} ${ROLLOUT.version}`, 'Welle 2/3', badge(`${haben.filter(istAktuell).length}/${haben.length}`, 'outline', 'font-medium tabular-nums'), 'Welle 3 am 11.12.', 'calendar', 'Nach dem Sperrfenster aus dem Manifest')}
    </div>
    <div class="mt-4 grid gap-3">${serverAlerts()}</div>
    <div class="mt-4 grid grid-cols-1 gap-4 xl:grid-cols-3">
      ${Card(CardHeader('Aktive Kunden', 'Juni bis November 2026', Tabs([['6m', '6 Monate'], ['30t', '30 Tage']], '6m', 'noop', 'h-8 [&>button]:px-2.5 [&>button]:text-xs')) + CardContent(areaChart(), 'pt-2'), 'xl:col-span-2')}
      ${Card(CardHeader('Letzte Ereignisse', 'Heute Nacht und davor') + CardContent(`<ul class="grid grid-cols-[minmax(0,1fr)] gap-4">${events.map(([ic, t, d, z]) => `<li class="flex min-w-0 items-start gap-3"><span class="flex size-8 shrink-0 items-center justify-center rounded-md border">${icon(ic, cx('size-4', ic === 'triangle-alert' && 'text-warn'))}</span><div class="min-w-0 flex-1"><p class="text-sm font-medium leading-none">${t}</p><p class="mt-1 truncate text-sm text-muted-foreground">${d}</p></div><span class="shrink-0 text-xs tabular-nums text-muted-foreground">${z}</span></li>`).join('')}</ul>`))}
    </div>
    <div class="mt-4">${instanceTable({ compact: true })}</div>`;
};

// ---------- Datentabelle ----------
const filtered = () => {
  const q = state.query.toLowerCase();
  return instances.filter(i => (state.filter === 'alle' || i.status === state.filter) && (!q || i.name.toLowerCase().includes(q) || i.sub.includes(q)));
};

const instanceTable = ({ compact = false } = {}) => {
  const rows = compact ? instances.filter(i => i.status !== 'gesund' || !istAktuell(i)).slice(0, 5) : filtered();
  const n = s => instances.filter(i => i.status === s).length;
  const all = rows.length && rows.every(r => state.checked.has(r.id));
  const some = rows.some(r => state.checked.has(r.id));
  const head = `
    <thead class="sticky top-0 z-10 bg-muted">
      <tr class="border-b">
        ${compact ? '' : `<th class="h-10 w-10 px-2 pl-4 text-left align-middle">${Checkbox('cb-all', all ? true : some ? 'mixed' : false, 'data-act="check-all" aria-label="Alle auswählen"')}</th>`}
        <th class="h-10 px-2 ${compact ? 'pl-4' : ''} text-left align-middle font-medium text-muted-foreground">Kunde</th>
        <th class="h-10 px-2 text-left align-middle font-medium text-muted-foreground">Produkt</th>
        <th class="h-10 px-2 text-left align-middle font-medium text-muted-foreground">Status</th>
        <th class="h-10 px-2 text-left align-middle font-medium text-muted-foreground">Version</th>
        <th class="h-10 px-2 text-left align-middle font-medium text-muted-foreground">Letztes Backup</th>
        <th class="h-10 px-2 text-left align-middle font-medium text-muted-foreground">Tarif</th>
        <th class="h-10 px-2 text-right align-middle font-medium text-muted-foreground">Speicher</th>
        <th class="h-10 w-12 px-2 pr-4"></th>
      </tr>
    </thead>`;
  const body = rows.map(i => `
    <tr class="${cx('border-b transition-colors hover:bg-muted/50', state.checked.has(i.id) && 'bg-muted')}" data-state="${state.checked.has(i.id) ? 'selected' : ''}">
      ${compact ? '' : `<td class="p-2 pl-4 align-middle">${Checkbox('cb-' + i.id, state.checked.has(i.id), `data-act="check" data-key="${i.id}" aria-label="${esc(i.name)} auswählen"`)}</td>`}
      <td class="p-2 ${compact ? 'pl-4' : ''} align-middle"><button type="button" data-act="detail" data-key="${i.id}" class="text-left"><span class="block font-medium hover:underline hover:underline-offset-4">${esc(i.name)}</span><span class="block font-mono text-xs text-muted-foreground">${i.sub}.${DOMAIN}</span></button></td>
      <td class="p-2 align-middle">${produktBadge(i.produkt)}</td>
      <td class="p-2 align-middle">${statusBadge(i.status)}</td>
      <td class="p-2 align-middle">${badge(i.version, 'outline', 'px-1.5 font-mono font-normal text-muted-foreground')}${istAktuell(i) ? '' : icon('arrow-up', 'ml-1 inline size-3.5 text-info')}</td>
      <td class="${cx('p-2 align-middle tabular-nums', !i.backupOk && 'font-medium text-warn')}">${i.backup}</td>
      <td class="${cx('p-2 align-middle', i.tarif === 'Gekündigt' && 'text-muted-foreground')}">${i.tarif}</td>
      <td class="p-2 text-right align-middle font-mono text-xs tabular-nums">${i.speicher.toFixed(1).replace('.', ',')} GB</td>
      <td class="p-2 pr-4 text-right align-middle">${button(icon('ellipsis-vertical'), { variant: 'ghost', size: 'icon-sm', act: 'menu', data: `data-key="${i.id}"`, aria: 'aria-label="Aktionen" aria-haspopup="menu"', cls: 'size-8 text-muted-foreground data-[open=true]:bg-muted' })}</td>
    </tr>`).join('') || `<tr><td colspan="9" class="h-24 p-2 text-center align-middle text-muted-foreground">Keine Ergebnisse.</td></tr>`;

  if (compact) return Card(CardHeader('Braucht Aufmerksamkeit', 'Warnungen, ausstehende Updates und gekündigte Installationen', button('Alle Installationen', { variant: 'outline', size: 'sm', act: 'nav', data: 'data-key="instanzen"' })) + `<div class="overflow-x-auto border-t"><table class="w-full min-w-[880px] caption-bottom text-sm">${head}<tbody>${body}</tbody></table></div>`, 'overflow-hidden');

  return `
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div class="max-w-full overflow-x-auto">${Tabs([['alle', 'Alle', instances.length], ['gesund', 'Gesund', n('gesund')], ['warnung', 'Warnung', n('warnung')], ['nurlesen', 'Nur lesen', n('nurlesen')]], state.filter, 'filter')}</div>
      <div class="flex w-full items-center gap-2 sm:w-auto">
        <div class="relative flex-1 sm:w-64 sm:flex-none">${icon('search', 'absolute left-2.5 top-2.5 size-4 text-muted-foreground')}${Input('search', { type: 'search', ph: 'Installationen filtern …', value: state.query, cls: 'h-9 pl-8' })}</div>
        ${button('Spalten', { variant: 'outline', size: 'sm', ic: 'columns-3', cls: 'h-9 hidden lg:inline-flex', act: 'toast', data: 'data-msg="Spalten" data-desc="Im Mockup ohne Funktion."' })}
        ${button('<span class="hidden lg:inline">Kunde anlegen</span>', { variant: 'outline', size: 'sm', ic: 'plus', act: 'open-new', cls: 'h-9' })}
      </div>
    </div>

const dl = rows => `<dl class="grid gap-3 text-sm">${rows.map(([k, v]) => `<div class="flex items-center justify-between gap-4"><dt class="text-muted-foreground">${k}</dt><dd class="text-right font-medium">${v}</dd></div>`).join('')}</dl>`;

const viewDetail = () => {

        ${m.checks.map(([id, l, ic]) => id === 'backup'

        ['Angelegt', `<span class="tabular-nums">${i.angelegt}</span>`],

      ])) + CardFooter(`<div class="w-full">${Progress(i.speicher * 10)}<p class="mt-2 text-xs text-muted-foreground">Speicher der Installation</p></div>`))}
    </div>
    <div class="mt-4">${Alert('shield-check', 'Kein Zugriff auf Buchungsdaten', 'Die Steuerzentrale schreibt nie in die Datenbank einer Installation. Restore oder Einblick nur mit Auftrag des Kunden; jeder Zugriff steht im Ereignisprotokoll.')}</div>`;
  } else if (state.tab === 'einstellungen') {

    body = m.env.length ? Card(CardHeader('Umgebungsvariablen', `Aus dem Manifest von ${m.name}. Nur die Werte „Installation“ stellt ihr hier ein; Betreiber-Werte unter Produkte, automatische erzeugt die Steuerzentrale.`, button('Speichern', { size: 'sm', act: 'save-inst-env' })) + `
      <div class="overflow-x-auto border-t"><table class="w-full min-w-[640px] text-sm"><thead class="bg-muted"><tr class="border-b">${th('Variable', 'pl-6')}${th('Ebene')}${th('Wert', 'pr-6')}</tr></thead><tbody>${m.env.map(zeile).join('')}</tbody></table></div>`, 'overflow-hidden')
      : Alert('file-text', 'Noch keine Variablen im Manifest', `${m.name} beschreibt seine Umgebungsvariablen noch nicht. Bis dahin setzt die Steuerzentrale nur Subdomain und Schlüssel.`);
  } else if (state.tab === 'backups') {
    const snaps = i.backupOk
      ? [['heute, 03:15', '1,24 GB', true, 'täglich'], ['gestern, 03:15', '1,24 GB', true, 'täglich'], ['01.11.2026', '1,19 GB', true, 'monatlich'], ['01.01.2026', '0,62 GB', true, 'jährlich']]
      : [['heute, 03:15', '–', false, 'täglich'], ['gestern, 03:15', '–', false, 'täglich'], ['09.11.2026', '0,88 GB', true, 'täglich'], ['01.11.2026', '0,85 GB', true, 'monatlich']];
    body = Card(CardHeader('Snapshots', 'restic, außerhalb des Hosts. Aufbewahrung: 14 tägliche, 24 monatliche, 11 jährliche.', button('Backup jetzt', { variant: 'outline', size: 'sm', ic: 'play', act: 'toast', data: 'data-msg="Backup gestartet" data-desc="Der Agent ruft das Backup aus dem Manifest auf."' })) + `
      <div class="overflow-x-auto border-t"><table class="w-full min-w-[560px] text-sm">
        <thead class="bg-muted"><tr class="border-b"><th class="h-10 px-2 pl-6 text-left font-medium text-muted-foreground">Zeitpunkt</th><th class="h-10 px-2 text-left font-medium text-muted-foreground">Ergebnis</th><th class="h-10 px-2 text-left font-medium text-muted-foreground">Stufe</th><th class="h-10 px-2 text-right font-medium text-muted-foreground">Größe</th><th class="h-10 px-2 pr-6"></th></tr></thead>
        <tbody class="[&_tr:last-child]:border-0">${snaps.map(([t, g, ok, s]) => `<tr class="border-b hover:bg-muted/50"><td class="p-2 pl-6 tabular-nums">${t}</td><td class="p-2">${ok ? badge(icon('circle-check', 'size-3.5 text-ok') + 'Erfolgreich', 'outline', 'px-1.5 font-medium text-muted-foreground') : badge(icon('circle-x', 'size-3.5 text-destructive') + 'Fehlgeschlagen', 'outline', 'px-1.5 font-medium text-muted-foreground')}</td><td class="p-2 text-muted-foreground">${s}</td><td class="p-2 text-right font-mono text-xs tabular-nums">${g}</td><td class="p-2 pr-6 text-right">${ok ? button('Wiederherstellen', { variant: 'ghost', size: 'sm', act: 'open-restore' }) : ''}</td></tr>`).join('')}</tbody>
      </table></div>`, 'overflow-hidden');
  } else {
    const ev = [
      [i.backupOk ? 'archive' : 'triangle-alert', i.backupOk ? 'Backup erfolgreich' : 'Backup fehlgeschlagen', i.backupOk ? '1,24 GB, Prüfung des Dumps bestanden' : 'Kein Platz auf dem Server (91 %)', 'heute, 03:15'],
      ['life-buoy', 'Support-Anfrage beantwortet', 'Login-Problem, gelöst ohne Datenzugriff', 'gestern, 14:02'],
      ['refresh-cw', `Update auf ${i.version}`, 'Backup davor, 2 Migrationen, Healthcheck grün', '08.11., 03:40'],
      ['sparkles', 'Installation angelegt', 'Schlüssel erzeugt, Einladung an den Inhaber verschickt', i.angelegt],
    ];
    body = Card(CardHeader('Ereignisse', 'Alles, was die Steuerzentrale an dieser Installation tut') + CardContent(`<ol class="relative grid gap-6 border-l pl-6">${ev.map(([ic, t, d, z]) => `<li class="relative"><span class="absolute -left-[37px] flex size-6 items-center justify-center rounded-full border bg-background">${icon(ic, cx('size-3', ic === 'triangle-alert' && 'text-warn'))}</span><div class="flex flex-wrap items-baseline justify-between gap-2"><p class="text-sm font-medium leading-none">${t}</p><time class="text-xs tabular-nums text-muted-foreground">${z}</time></div><p class="mt-1 text-sm text-muted-foreground">${d}</p></li>`).join('')}</ol>`, 'pl-9'));

  return `
    <div class="flex flex-wrap items-start justify-between gap-4">
      <div class="flex min-w-0 items-center gap-4">
        ${Avatar(i.name.split(' ').map(w => w[0]).join('').slice(0, 2), 'size-12 rounded-xl text-sm')}
        <div class="min-w-0 space-y-1"><div class="flex flex-wrap items-center gap-2"><h1 class="text-2xl font-semibold tracking-tight">${esc(i.name)}</h1>${produktBadge(i.produkt)}${statusBadge(i.status)}</div><p class="font-mono text-xs text-muted-foreground">${i.sub}.${DOMAIN}</p></div>
      </div>
      <div class="flex flex-wrap gap-2">
        ${button('Öffnen', { variant: 'outline', ic: 'external-link', act: 'toast', data: 'data-msg="Im Mockup nicht verlinkt" data-desc="Öffnet die Installation des Kunden."' })}
        ${i.status === 'nurlesen'
          ? button('Vollexport', { ic: 'download', act: 'toast', data: 'data-msg="Vollexport angestoßen" data-desc="Jahresarchive und Änderungsprotokoll gehen an den Kunden."' })

    <div class="mt-6">${Tabs([['zustand', 'Zustand'], ['einstellungen', 'Einstellungen'], ['backups', 'Backups'], ['ereignisse', 'Ereignisse']], state.tab, 'tab')}</div>
    <div class="mt-4">${body}</div>`;
};

// ---------- Server ----------
const meter = (label, pct) => `<div class="grid gap-1"><div class="flex justify-between text-xs"><span class="text-muted-foreground">${label}</span><span class="tabular-nums">${pct} %</span></div>${Progress(pct, pct >= 90 ? 'bg-warn' : 'bg-primary')}</div>`;
const mini = pct => `<div class="flex items-center gap-2"><div class="h-1.5 w-14 overflow-hidden rounded-full bg-primary/20"><div class="h-full ${pct >= 90 ? 'bg-warn' : 'bg-primary'}" style="width:${pct}%"></div></div><span class="${cx('w-9 text-xs tabular-nums', pct >= 90 ? 'font-medium text-warn' : 'text-muted-foreground')}">${pct} %</span></div>`;

const viewServer = () => {

      ${sectionCard('Neustart fällig', n('neustart'), badge(icon('power', 'size-3') + 'Kernel', 'outline', 'font-medium'), 'Heute 03:30 im Wartungsfenster', 'clock', 'Gemeinsame Server: betrifft alle Kunden darauf')}
      ${sectionCard('Platte fast voll', n('platte'), badge(icon('hard-drive', 'size-3 text-warn') + '≥ 90 %', 'outline', 'font-medium'), 'Studio Lind, eigener Server', 'arrow-right', 'Größeren Server-Typ wählen')}

        <thead class="bg-muted"><tr class="border-b">${th('Server', 'pl-4')}${th('Art')}${th('Status')}${th('Kunden')}${th('RAM')}${th('Platte')}${th('Updates')}${th('Agent')}<th class="h-10 w-12 px-2 pr-4"></th></tr></thead>

            <td class="p-2 pl-4"><button type="button" data-act="server-detail" data-key="${sv.id}" class="text-left"><span class="block whitespace-nowrap font-medium hover:underline hover:underline-offset-4">${esc(sv.kunde)}</span><span class="block whitespace-nowrap font-mono text-xs text-muted-foreground">${sv.name} · ${sv.anbieter}</span></button></td>
            <td class="p-2">${artBadge(sv)}</td>

};

const viewServerDetail = () => {

    </div>
    <div class="mt-6 grid gap-4 lg:grid-cols-3">
      ${Card(CardHeader('Auslastung', `Vom Agenten, ${sv.agent}`) + CardContent(`<div class="grid gap-4">${meter('CPU (15 Min.)', sv.cpu)}${meter('Arbeitsspeicher', sv.ram)}${meter('Platte', sv.disk)}</div>`))}
      ${Card(CardHeader('System') + CardContent(dl([['Anbieter', `${sv.anbieter} · ${sv.typ}`], ['Architektur', `${sv.arch}, ${sv.ramGb} GB RAM`], ['IP', `<span class="font-mono text-xs">${sv.ip}</span>${sv.ipv4 ? '' : ' (privat)'}`], ['PTR', sv.ptr ? `<span class="font-mono text-xs">${sv.ptr}</span>` : '<span class="text-muted-foreground">nicht gesetzt</span>'], ['Ports der Apps', appsOf(sv).flatMap(i => PRODUKTE[i.produkt].fakten.ports).join(', ') || '<span class="text-muted-foreground">nur 80, 443</span>'], ['Erreichbar über', sv.zugang], ['Betriebssystem', 'Debian 13'], ['Docker', '28.5'], ['Laufzeit', sv.laufzeit], ['Firewall', sv.zugang === 'Cloudflare Tunnel' ? 'kein offener Port' : 'aus den Manifesten; SSH zu'], ['Updates', 'unattended-upgrades']])))}
      ${Card(CardHeader('Apps auf diesem Server', `${appsOf(sv).length} ${appsOf(sv).length === 1 ? 'Installation' : 'Installationen'} von ${kundenOf(sv).length} ${kundenOf(sv).length === 1 ? 'Kunde' : 'Kunden'}`) + CardContent(`<ul class="grid grid-cols-[minmax(0,1fr)] gap-3">${appsOf(sv).map(i => `<li><button type="button" data-act="detail" data-key="${i.id}" class="flex w-full min-w-0 items-center gap-3 rounded-lg border p-3 text-left transition-colors hover:bg-muted/50"><span class="flex size-8 items-center justify-center rounded-md bg-muted">${icon(PRODUKTE[i.produkt].ic)}</span><span class="min-w-0 flex-1"><span class="block truncate text-sm font-medium">${esc(i.name)} · ${PRODUKTE[i.produkt].name} <span class="font-mono text-xs font-normal text-muted-foreground">${i.version}</span></span><span class="block truncate font-mono text-xs text-muted-foreground">${i.sub}.${DOMAIN}</span></span><span class="shrink-0">${statusBadge(i.status)}</span></button></li>`).join('')}</ul>`))}

      : Alert('shield-check', 'System aktuell', 'Keine ausstehenden Updates, kein Neustart nötig. unattended-upgrades prüft täglich.')}</div>`;
};

// ---------- Produkte ----------
const manifestText = (k, m) => [`produkt: ${k}`, `name: ${m.name}`, `image: ${m.image}`, `version: ${m.version}`, `architektur: [${m.fakten.arch.join(', ')}]`, `ressourcen: { ram_mb: ${m.fakten.ram}, platte_gb: ${m.fakten.platte} }`, `container: ${m.fakten.container}`, `netz:`, `  http: ${m.fakten.ports.length && !m.sub ? 'nein' : 'an die Pforte'}`, `  ports: [${m.fakten.ports.join(', ')}]`, `  oeffentliche_ipv4: ${m.fakten.ipv4}`, `  server_fuer_sich: ${m.fakten.allein}`, `proxy: ${m.fakten.proxy}`, `optionen: [${m.fakten.optionen.join(', ')}]`, `braucht: [${m.fakten.braucht.join(', ')}]`, `bietet: [${m.fakten.bietet.join(', ')}]`, `anmeldung: ${m.fakten.anmeldung}`, ...(m.nach_update ? [`schritte:`, `  nach_update: [${m.nach_update}]`] : []), ...(m.fakten.geraete ? [`beim_kunden: ${m.fakten.geraete}  # nicht verwaltet`] : []), `subdomain: "${m.sub}<kunde>"`, `status: ${m.status}`, `health: ${m.health}`, `backup: ${m.backup}`, `export: ${m.export}`, `nur_lesen: ${m.nur_lesen || 'folgt'}`, `env:${m.env.length ? '' : ' folgt'}`, ...m.env.map(v => `  - ${v.name}: { ebene: ${v.ebene}, typ: ${v.typ}${v.muster ? `, muster: "${v.muster}"` : ''}${v.standard ? `, standard: ${v.standard}` : ''} }`),

  const i = instances.find(x => x.id === id);
  state.menu = id; btnEl.dataset.open = 'true';
  const item = (l, ic, act, extra = '', cls = '') => `<button type="button" role="menuitem" data-act="${act}" data-key="${id}" ${extra} class="${cx('relative flex w-full cursor-default select-none items-center gap-2 rounded-sm px-2 py-1.5 text-sm outline-none transition-colors hover:bg-accent focus:bg-accent', cls)}">${icon(ic)}${l}</button>`;
  overlay(`
    <div class="fixed inset-0 z-40" data-act="close"></div>
    <div role="menu" class="zoom-in fixed z-50 min-w-[12rem] overflow-hidden rounded-md border bg-popover p-1 text-popover-foreground shadow-md" style="top:${Math.min(r.bottom + 4, innerHeight - 260)}px; left:${Math.max(8, r.right - 192)}px;">
      <div class="px-2 py-1.5 text-sm font-semibold">${esc(i.name)}</div>
      <div class="-mx-1 my-1 h-px bg-muted"></div>
      ${item('Details', 'panel-right', 'detail')}
      ${item('Server ansehen', 'hard-drive', 'menu-server')}
      ${item('Backup jetzt', 'archive', 'toast', 'data-msg="Backup gestartet" data-desc="Der Agent ruft das Backup aus dem Manifest auf."')}
      ${item(`Auf ${PRODUKTE[i.produkt].version} aktualisieren`, 'refresh-cw', 'toast', 'data-msg="In nächste Welle aufgenommen"', istAktuell(i) ? 'pointer-events-none opacity-50' : '')}
      ${item('Nur lesen schalten', 'lock', 'menu-readonly', '', PRODUKTE[i.produkt].nur_lesen ? '' : 'pointer-events-none opacity-50')}
      <div class="-mx-1 my-1 h-px bg-muted"></div>
      ${item('Löschen', 'trash-2', 'toast', 'data-msg="Löschen erst nach Vollexport" data-desc="Erst nur lesen, dann Export an den Kunden."', 'text-destructive hover:text-destructive focus:text-destructive')}
    </div>`);
  document.querySelector('[role=menu] [role=menuitem]').focus();
};

const openMobileNav = () => {
  state.mobileNav = true;
  overlay(`<div class="fade-in fixed inset-0 z-50 bg-black/80" data-act="close"></div>
    <div class="slide-in fixed inset-y-0 left-0 z-50 flex w-72 flex-col border-r bg-[hsl(var(--sidebar))] shadow-lg" style="padding-top: env(safe-area-inset-top, 0px); padding-left: env(safe-area-inset-left, 0px);">${sidebarInner()}</div>`);
};

// ---------- Rendern ----------
const render = () => {
  const app = document.getElementById('app');
  if (state.role === 'kunde') { app.innerHTML = viewKunde(); return; }
  const titles = { uebersicht: 'Übersicht', server: 'Server', instanzen: 'Installationen', produkte: 'Apps', updates: 'Updates', backups: 'Backups', kunden: 'Kunden', abrechnung: 'Leistungen', support: 'Support' };
  const crumbs = state.view === 'detail'
    ? crumb([['Installationen', 'instanzen'], [esc(instances.find(x => x.id === state.selected).name + ' · ' + PRODUKTE[instances.find(x => x.id === state.selected).produkt].name)]])
    : state.view === 'serverdetail'
      ? crumb([['Server', 'server'], [esc(servers.find(x => x.id === state.srv).kunde)]])
      : crumb([[titles[state.view]]]);
  const content = { uebersicht: viewUebersicht, server: viewServer, serverdetail: viewServerDetail, produkte: viewProdukte, instanzen: viewInstanzen, detail: viewDetail, updates: viewUpdates, backups: viewBackups, kunden: viewKunden, abrechnung: viewAbrechnung, support: viewSupport }[state.view] || viewLeer;
  app.innerHTML = `
    <div class="flex min-h-svh w-full bg-[hsl(var(--sidebar))]">
      <aside class="sticky top-0 hidden h-svh w-64 shrink-0 flex-col md:flex">${sidebarInner()}</aside>
      <div class="relative flex min-w-0 flex-1 flex-col bg-background md:m-2 md:ml-0 md:rounded-xl md:border md:shadow-sm">
        ${siteHeader(crumbs)}
        <main class="gutter flex-1 py-4 md:py-6 lg:px-6">${content()}</main>
      </div>
    </div>`;
  const s = document.getElementById('search');
  if (s && state.focusSearch) { s.focus(); const l = s.value.length; s.setSelectionRange(l, l); }
};

// ---------- Ereignisse ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const { act, key } = el.dataset;
  state.focusSearch = false;
  switch (act) {
    case 'nav': closeOverlay(); state.view = key; state.query = ''; render(); scrollTo(0, 0); break;
    case 'ticket': state.ticket = key; tickets.find(x => x.id === key).neu = false; render(); break;
    case 'role': state.role = key; render(); scrollTo(0, 0); break;
    case 'theme': { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; break; }
    case 'filter': state.filter = key; render(); break;
    case 'tab': state.tab = key; render(); break;
    case 'detail': closeOverlay(); state.selected = key; state.view = 'detail'; state.tab = 'zustand'; render(); scrollTo(0, 0); break;
    case 'check': state.checked.has(key) ? state.checked.delete(key) : state.checked.add(key); render(); break;
    case 'check-all': { const rows = filtered(); const all = rows.every(r => state.checked.has(r.id)); rows.forEach(r => all ? state.checked.delete(r.id) : state.checked.add(r.id)); render(); break; }
    case 'bulk-backup': toast(`Backup für ${state.checked.size} Installationen gestartet`); state.checked.clear(); render(); break;
    case 'menu': if (state.menu === key) closeOverlay(); else openMenu(el, key); break;
    case 'server-detail': closeOverlay(); state.srv = key; state.view = 'serverdetail'; render(); scrollTo(0, 0); break;
    case 'menu-server': closeOverlay(); state.srv = instances.find(x => x.id === key).server; state.view = 'serverdetail'; render(); scrollTo(0, 0); break;
    case 'open-reboot': openReboot(); break;
    case 'open-add-server': openAddServer(); break;
    case 'open-produkt-env': openProduktEnv(key); break;
    case 'save-inst-env': { const i = instances.find(x => x.id === state.selected); PRODUKTE[i.produkt].env.filter(v => v.ebene === 'installation').forEach(v => { const el = document.getElementById(`ie-${v.name}`); if (el) { if (el.value && el.value !== (v.standard || '')) i.env[v.name] = el.value; else delete i.env[v.name]; } }); if (i.env.HABEN_READONLY === 'true') i.status = 'nurlesen'; render(); toast('Einstellungen gespeichert', `Der Agent schreibt die .env von ${i.name} und startet ${PRODUKTE[i.produkt].name} neu.`); break; }
    case 'copy-cmd': { try { navigator.clipboard.writeText(state.cmd).then(() => toast('Befehl kopiert'), () => toast('Kopieren nicht möglich', 'Bitte den Befehl markieren und kopieren.')); } catch { toast('Kopieren nicht möglich', 'Bitte den Befehl markieren und kopieren.'); } break; }
    case 'confirm-reboot': { const sv = servers.find(x => x.id === state.srv); sv.reboot = false; sv.updates = 0; sv.laufzeit = '0 Tage'; closeOverlay(); render(); toast('Server neu gestartet', `${sv.kunde}: alle Apps wieder erreichbar.`); break; }
    case 'menu-readonly': closeOverlay(); state.selected = key; openReadonly(); break;
    case 'toggle-nav': openMobileNav(); break;
    case 'toast': closeOverlay(); toast(el.dataset.msg, el.dataset.desc || ''); break;
    case 'open-new': closeOverlay(); openNew(); break;
    case 'open-readonly': openReadonly(); break;
    case 'open-restore': openRestore(); break;
    case 'open-cancel': openCancel(); break;
    case 'close': closeOverlay(); break;
    case 'confirm-readonly': { const i = instances.find(x => x.id === state.selected); i.status = 'nurlesen'; i.tarif = 'Gesperrt'; closeOverlay(); render(); toast('Nur lesen aktiv', `${i.name} kann lesen und exportieren.`); break; }
    case 'confirm-restore': closeOverlay(); toast('Restore eingeplant', 'Der aktuelle Stand wird vorher gesichert.'); break;
    case 'confirm-cancel': closeOverlay(); toast('Kündigung eingegangen', 'Die Bestätigung kommt per E-Mail.'); break;
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'search') { state.query = e.target.value; state.focusSearch = true; render(); }
  if (e.target.id === 'nf-firma') {
    const sub = document.getElementById('nf-sub');
    if (sub && !sub.dataset.touched) sub.value = e.target.value.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  }
  if (e.target.id === 'nf-sub') e.target.dataset.touched = '1';
  if (e.target.name === 'nf-prod') { const box = document.getElementById('nf-felder'); if (box) box.innerHTML = felderHtml([...document.querySelectorAll('input[name=nf-prod]:checked')].map(x => x.value)); }
  if (e.target.name === 'nf-prod' || e.target.id === 'nf-srv') { const box = document.getElementById('nf-platz'); if (box) box.innerHTML = platzHtml([...document.querySelectorAll('input[name=nf-prod]:checked')].map(x => x.value), servers.find(x => x.id === document.getElementById('nf-srv').value), document.getElementById('nf-firma').value); }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'new-form') {
    const name = document.getElementById('nf-firma').value.trim();
    const sub = document.getElementById('nf-sub').value.trim();
    const prods = [...document.querySelectorAll('input[name=nf-prod]:checked')].map(x => x.value);
    if (!prods.length) { toast('Mindestens ein Produkt wählen'); return; }
    const id = sub + '-' + Date.now();
    const wahl = document.getElementById('nf-srv').selectedIndex;
    const sv = servers.filter(x => !x.neu && x.art !== 'kunde')[wahl];
    const neue = prods.map((k, n) => ({ id: id + '-' + k, produkt: k, server: sv.id, name, sub: PRODUKTE[k].sub + sub, version: PRODUKTE[k].version, backup: 'noch keins', backupOk: true, status: 'neu', tarif: n === 0 ? 'Standard' : 'Zusatz', host: '', angelegt: 'heute', speicher: 0.1,
      werte: {}, env: Object.fromEntries(PRODUKTE[k].env.filter(v => v.ebene === 'installation' && document.getElementById(`nf-e-${k}-${v.name}`)?.value).map(v => [v.name, document.getElementById(`nf-e-${k}-${v.name}`).value])) }));
    instances.unshift(...neue);
    closeOverlay(); state.view = 'instanzen'; state.filter = 'alle'; state.query = ''; render();
    toast('Produkte werden installiert', `${sv.kunde}: der Agent hat den Auftrag abgeholt.`);
    setTimeout(() => { neue.forEach(i => { i.status = 'gesund'; i.backup = 'heute, ' + new Date().toTimeString().slice(0, 5); }); if (state.role === 'admin') render(); toast('Kunde bereit', `${neue.length} ${neue.length === 1 ? 'Produkt' : 'Produkte'} installiert, Einladung verschickt.`); }, 3000);
  }
  if (e.target.id === 'add-server-form') {
    const nm = document.getElementById('as-name').value.trim();
    const art = document.querySelector('input[name=as-art]:checked').value;
    const anb = art === 'kunde' ? 'beim Kunden' : document.getElementById('as-anbieter').value;
    const tunnel = document.getElementById('as-tunnel').checked;
    const id = 'srv-' + Date.now();
    const token = 'hh_join_' + Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 10);
    const sv = { id, kunde: nm, name: nm.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''), ip: '–', typ: '–', anbieter: anb, art, zugang: tunnel ? 'Cloudflare Tunnel' : 'Caddy', cpu: 0, ram: 0, disk: 0, updates: 0, reboot: false, agent: 'wartet …', laufzeit: '–', neu: true };
    servers.push(sv);
    openInstallCommand(sv, token);
    if (state.view === 'server') render();
    setTimeout(() => { delete sv.neu; sv.agent = 'vor 1 Min.'; sv.ip = '203.0.113.' + (30 + servers.length); sv.typ = art === 'kunde' ? 'eigene Hardware' : 'VPS'; sv.cpu = 3; sv.ram = 18; sv.disk = 6; sv.laufzeit = '0 Tage'; if (state.role === 'admin') render(); toast('Agent meldet sich', `${nm}: Docker, Firewall und Updates eingerichtet.`); }, 4000);
  }
  if (e.target.id === 'produkt-env-form') {
    const k = Object.keys(PRODUKTE).find(x => document.getElementById('pe-' + (PRODUKTE[x].env.find(v => v.ebene === 'betreiber') || {}).name));
    PRODUKTE[k].env.filter(v => v.ebene === 'betreiber').forEach(v => { const el = document.getElementById('pe-' + v.name); if (el.value) BETREIBER_ENV[k][v.name] = v.typ === 'geheim' ? '••••' : el.value; });
    closeOverlay(); toast('Gespeichert', `Gilt für alle ${instances.filter(i => i.produkt === k).length} Installationen von ${PRODUKTE[k].name}; Neustart im Wartungsfenster.`);
  }
  if (e.target.id === 'reply') {
    const t = tickets.find(x => x.id === state.ticket) || tickets[0];
    t.verlauf.push(['Support', esc(document.getElementById('reply-text').value)]);
    render(); toast('Antwort gesendet', `An ${t.kunde}`);
  }
  if (e.target.id === 'invite') {
    const v = document.getElementById('invite-mail').value;
    const r = document.getElementById('invite-rolle').value; e.target.reset(); toast('Einladung verschickt', `${v} bekommt die Rolle ${r}.`);
  }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlay(); });

render();
</script>
