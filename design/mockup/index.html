// Platzierung (Z-204): Manifest + Serverfakten + vorhandene Installationen → Gründe und Hinweise
const platzierung = (app, sv, kundeId, optionen = []) => {
  const m = APPS[app], vorhanden = appsOf(sv), gruende = [], hinweise = [];
  if (sv.agent[1] === 'getrennt') gruende.push('Der Agent dieses Servers ist getrennt.');
  const k = kunden.find(x => x.id === kundeId) || {};
  if (sv.kunde && sv.kunde !== kundeId) gruende.push(`${sv.name} ist der Server eines anderen Kunden.`);
  if (m.version && m.image === false) gruende.push(`${m.name} hat noch kein Image.`);
  if (!m.architektur.includes(sv.arch)) gruende.push(`${m.name} gibt es nur für ${m.architektur.join(', ')}; der Server ist ${sv.arch}.`);
  if (m.allein && vorhanden.length) gruende.push(`${m.name} braucht einen Server für sich; hier laufen ${vorhanden.length} Installationen.`);
  const allein = vorhanden.find(i => APPS[i.app].allein);
  if (allein) gruende.push(`Auf dem Server läuft ${APPS[allein.app].name}, das ihn für sich braucht.`);
  if (m.rootful && !m.allein) gruende.push('rootful ist nur mit „Server für sich“ erlaubt.');
  if (m.proxy === 'eigen' && vorhanden.length) gruende.push('Eigener Proxy braucht 80/443, die hier die Pforte hält.');
  if (m.ipv4 && !sv.ipv4) gruende.push(`${m.name} braucht eine öffentliche IPv4; der Server ist nur über ${sv.zugang} erreichbar.`);
  if (m.bietet.includes('smtp') && sv.ipv4 && !sv.ptr) gruende.push('Für Mail fehlt der PTR-Eintrag der IPv4.');
  const belegt = vorhanden.flatMap(i => APPS[i.app].ports), doppelt = m.ports.filter(p => belegt.includes(p));
  if (doppelt.length) gruende.push(`Port ${doppelt.join(', ')} ist auf dem Server schon belegt.`);
  const ram = ramVergeben(sv) + m.ram + (optionen.includes('nodeodm') ? 8192 : 0), gesamt = sv.ramGb * 1024;
  if (ram > gesamt) gruende.push(`Zu wenig Arbeitsspeicher: ${Math.round(ram / 1024)} von ${sv.ramGb} GB nötig.`);
  else if (ram > gesamt * 0.8) hinweise.push(`Arbeitsspeicher wird knapp: ${Math.round(ram / 1024)} von ${sv.ramGb} GB vergeben.`);
  if (sv.disk >= 80) hinweise.push(`Platte schon zu ${sv.disk} % belegt; ${m.name} braucht ${m.platte} GB.`);
  if (m.braucht.includes('oidc-anbieter') && !installs.some(i => i.kunde === kundeId && APPS[i.app].bietet.includes('oidc-anbieter'))) hinweise.push(`${m.name} braucht einen Anmeldedienst (OIDC); der Kunde hat kein Kontext.`);
  if (m.env.some(([n, e, , pflicht]) => e === 'betreiber' && pflicht && !betreiberWerte()[n])) gruende.push('Ein Pflichtwert für den Betreiber fehlt (Einstellungen).');
  if (m.beimKunden && !gruende.length) hinweise.push(`Teile beim Kunden (${m.beimKunden}) verwaltet die Steuerzentrale nicht.`);
  return { gruende, hinweise };
};

const aufmerksamkeit = () => {
  const L = [];
  servers.forEach(sv => {
    if (sv.agent[1] !== 'verbunden') L.push(['krit', 'unplug', sv.name, `Agent ${sv.agent[1]} ${sv.agent[2]}; Installationen darauf ohne Zustand`, 'server-detail', sv.id]);
    if (sv.disk >= 80) L.push([sv.disk >= 90 ? 'krit' : 'warn', 'hard-drive', sv.name, `Platte zu ${sv.disk} % belegt`, 'server-detail', sv.id]);
    if (sv.neustart) L.push(['warn', 'power', sv.name, `Neustart für Kernel ${sv.kernel[1]} nötig; geplant im Wartungsfenster ${sv.wartung.split('–')[0]}`, 'server-detail', sv.id]);
    if (sv.zert && sv.zert <= 14) L.push(['warn', 'lock', sv.name, `Zertifikat läuft in ${sv.zert} Tagen ab`, 'server-detail', sv.id]);
    if (sv.pakete) L.push(['info', 'shield-check', sv.name, `${sv.pakete} Sicherheitsupdates stehen aus`, 'server-detail', sv.id]);
  });
  installs.forEach(i => {
    if (i.health === 'rot') L.push(['krit', 'circle-x', titel(i), i.grund, 'detail', i.id]);
    if (i.health === 'gelb') L.push(['warn', 'triangle-alert', titel(i), i.grund, 'detail', i.id]);
    if (i.pruef === 'gescheitert') L.push(['warn', 'archive-x', titel(i), 'Prüf-Restore gescheitert', 'detail', i.id]);
  });
  auftraege.filter(a => a.zustand === 'gescheitert' && !L.some(l => l[5] === a.ziel)).forEach(a => L.push(['warn', 'list-x', a.art, a.schritt, 'nav', 'auftraege']));

  const rang = { krit: 0, warn: 1, info: 2 };
  return L.sort((a, b) => rang[a[0]] - rang[b[0]]);
};
