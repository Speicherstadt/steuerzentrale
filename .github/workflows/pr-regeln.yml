# Regeln am Pull Request, aus der Werkbank (https://github.com/Speicherstadt/werkbank). Läuft auch für Entwürfe
# und reine Doku-Änderungen, denn der Titel wird beim Squash-Merge zum Commit auf main. Mit pull_request, nicht
# pull_request_target: Code aus Forks läuft nur mit Leserecht.
name: PR-Regeln

on:
  pull_request:
    # converted_to_draft for the job projekt: a draft only reserves its Bauliste item
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: pr-regeln-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-regeln:
    uses: Speicherstadt/werkbank/.github/workflows/pr-regeln.yml@main

  # What only this project checks (scripts/pr-regeln): Signed-off-by on every commit (DCO), the Bauliste
  # item ticked, docs/manifest.md with a change to packages/manifest. Title, issue references, code without
  # docs and a fix without a test are checked by the Werkbank above.
  projekt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Base and head of the pull request for git log and git diff
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Without bun install: the script needs only node: modules
      - run: bun scripts/pr-regeln/pruefen.ts
