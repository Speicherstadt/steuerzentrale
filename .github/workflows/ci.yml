name: CI

# Text only (Markdown, docs/, the license) changes no code: on main paths-ignore filters it, docs.yml checks docs/.
# A pull request always runs, so a required check never stays "Pending"; there the job changes skips the checks.
# The layout follows Speicherstadt/kennwort (.github/workflows/ci.yml): a changes job, parts side by side, one result.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call: # a later release.yml runs the same checks before publishing
  workflow_dispatch:

# A new push to a pull request cancels its outdated run; runs on main finish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # What a pull request touches. A job skipped by its `if` counts as passed for the rules on main, so every job
  # has !cancelled() and compares with 'false': when changes does not run (push, release, manual) or fails, its
  # outputs are empty and everything runs
  changes:
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: filter
        run: |
          set -euo pipefail
          changed="$(git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD)"
          printf '%s\n' "$changed"
          # docs/plan.md is read by tests (Z-203 checks the app table against the manifests): it counts as code
          tested='^docs/plan\.md$'
          other="$(grep -Ev '\.md$|^docs/|^LICENSE$' <<< "$changed" || true)$(grep -E "$tested" <<< "$changed" || true)"
          if [ -n "$changed" ] && [ -z "$other" ]; then code=false; else code=true; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  unit:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    # BAULISTE.md Z-703: Mailpit stands in for a mail server (docs/plan.md, "Was sich in der CI nicht
    # echt testen lässt"); modules/benachrichtigung/mailpit.test.ts sends through SMTP and reads its
    # API. v1.33.1 by digest (registry-1.docker.io, axllent/mailpit, queried 2026-11-23)
    services:
      mailpit:
        image: docker.io/axllent/mailpit@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: `checks pr` compares the branch with its base
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # minisign for the tests of install/install.sh (scripts/install-sh.test.ts); shellcheck is on the runner
      - run: sudo apt-get install -y -q minisign
      - run: bun run typecheck
      # Biome, allowed-dependencies.json and no Solid 1.x patterns (scripts/solid-muster.ts)
      - run: bun run lint
      # The shared rule checks of firsttris/workflows (checks.json: files past 400 lines, functions past 80,
      # rings of imports between packages, the Paraglide texts, every route of routeTree.gen.ts opened by
      # e2e/accessibility.spec.ts). Installed without saving,
      # as in Kennwort: the agents' sandbox cannot fetch a GitHub tarball, so it stays out of bun.lock.
      - run: bun add --dev --no-save "github:firsttris/workflows#v1"
      - run: bunx checks
      - if: github.event_name == 'pull_request'
        run: bunx checks pr
      - run: shellcheck --shell=sh install/install.sh
      # with CI=true the Mailpit test fails instead of skipping when these are missing
      - run: bun run test
        env:
          SZ_TEST_MAILPIT_SMTP: 127.0.0.1:1025
          SZ_TEST_MAILPIT_API: http://127.0.0.1:8025
      - run: bun run build
      # Zentrale and agent as one binary each for both server architectures (docs/plan.md, "Technologie")
      - run: ls -l apps/zentrale/dist/steuerzentrale-linux-{x64,arm64} apps/agent/dist/steuerzentrale-agent-linux-{x64,arm64}
      # Known vulnerabilities in the dependencies fail the run
      - run: bun audit

  # The agent against real Podman with systemd: ubuntu-24.04 ships Podman 4.9, the minimum (docs/plan.md,
  # "Podman"). With CI=true a missing Podman or a run without a test fails (vitest.agent.config.ts)
  agent:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # BAULISTE.md Z-401: two installations behind the Pforte, each as a Linux user of its own with
      # its own rootless network namespace, as sz-<installation> on a server; the test runs Podman
      # as them with sudo -u (apps/agent/test/pforte.agent.test.ts)
      # The runner image sets the runner's XDG directories (XDG_CONFIG_HOME, XDG_RUNTIME_DIR) in
      # /etc/environment, which pam_env hands every user's systemd manager: Quadlet would look for
      # the units of sz-pforte and sz-<installation> in the runner's home, Podman would use the
      # runner's /run/user. A server has no such lines.
      - name: No runner XDG directories for other users
        run: |
          sudo sed -i '/^XDG_/d' /etc/environment
          ! grep -q '^XDG_' /etc/environment
          cat /etc/environment
      - name: Linux users for the Pforte's test
        run: |
          erste=1000000
          for nutzer in sz-test-pa sz-test-pb; do
            sudo useradd -m -s /bin/bash "$nutzer"
            # rootless Podman needs subordinate ids; useradd gives them where /etc/subuid exists
            if ! grep -q "^$nutzer:" /etc/subuid; then
              sudo usermod --add-subuids "$erste-$((erste + 65535))" --add-subgids "$erste-$((erste + 65535))" "$nutzer"
            fi
            erste=$((erste + 65536))
            sudo loginctl enable-linger "$nutzer"
            uid="$(id -u "$nutzer")"
            for i in $(seq 1 30); do test -d "/run/user/$uid" && break; sleep 1; done
            test -d "/run/user/$uid"
          done
          echo "SZ_TEST_PFORTE_NUTZER=sz-test-pa sz-test-pb" >> "$GITHUB_ENV"
      # BAULISTE.md Z-402: the agent sets up installations by jobs with real useradd, loginctl and
      # runuser, through sudo (apps/agent/test/einrichtung.agent.test.ts). The Pforte's user as
      # install.sh makes it (pforte_einrichten); the agent writes and starts its unit. The users the
      # agent makes pull the example app from the test registry on localhost:5000, which speaks HTTP
      # (scripts/beispiel-images.ts); containers-registries.conf.d(5) lets Podman pull from it.
      - name: Pforte's user and test registry for the setup tests
        run: |
          sudo useradd --create-home --home-dir /home/sz-pforte --shell /usr/sbin/nologin \
            --comment "Pforte der Steuerzentrale" sz-pforte
          grep -q '^sz-pforte:' /etc/subuid
          sudo loginctl enable-linger sz-pforte
          uid="$(id -u sz-pforte)"
          for i in $(seq 1 30); do test -d "/run/user/$uid" && break; sleep 1; done
          test -d "/run/user/$uid"
          sudo mkdir -p /etc/containers/registries.conf.d
          printf '[[registry]]\nlocation = "localhost:5000"\ninsecure = true\n' |
            sudo tee /etc/containers/registries.conf.d/sz-test-registry.conf
          echo "SZ_TEST_EINRICHTUNG=1" >> "$GITHUB_ENV"
      # BAULISTE.md Z-601: apps/agent/test/backup.agent.test.ts starts MinIO by digest in a container
      # of the runner (port 29401) and installs the agent's binary as /usr/local/bin/sz-test-agent-*,
      # which the installation's backup service runs as its user; both go again after the test
      - run: podman --version && bun run test:agent
      - name: What the Pforte's user manager saw
        if: failure()
        run: |
          uid="$(id -u sz-pforte)"
          als() { sudo -n -u sz-pforte env -i HOME=/home/sz-pforte XDG_RUNTIME_DIR="/run/user/$uid" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" PATH=/usr/bin:/bin "$@"; }
          ls -la /usr/lib/systemd/user-generators/ /usr/libexec/podman/ || true
          sudo ls -laR /home/sz-pforte/.config || true
          als systemctl --user list-unit-files 'sz-*' --no-pager || true
          als systemctl --user status sz-pforte.service --no-pager || true
          sudo -n -u sz-pforte env -i HOME=/home/sz-pforte /usr/libexec/podman/quadlet --user --dryrun || true
          sudo journalctl --user-unit sz-pforte.service -n 50 --no-pager || true
          sudo journalctl _UID="$uid" -n 80 --no-pager || true
          # what the backup services of the installations printed (Z-601): tags and reasons, no values
          sudo journalctl --user-unit sz_backup.service -n 80 --no-pager || true

  # What a user does, desktop and @phone, with axe; Playwright fails when no test ran
  e2e:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e

  # BAULISTE.md Z-302: install/install.sh on a real server, a VM in Incus on the runner (KVM), with
  # systemd and rootless Podman as on Debian 13 and Ubuntu 24.04 (docs/plan.md, "Was sich in der CI
  # nicht echt testen lässt"). The Zentrale runs on the runner and serves the agent files signed with the
  # test key, so the script runs in test mode; afterwards the agent's service runs and the fingerprint
  # of its certificate is the one the Zentrale keeps. Then the agent updates itself to a newer release
  # the Zentrale serves and refuses one signed with another key (BAULISTE.md Z-504)
  server:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        system: ["debian/13", "ubuntu/24.04"]
    env:
      VM: sz-test-server
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Incus
        run: |
          sudo apt-get update -q
          # incus-agent lets `incus exec` into a VM; qemu and OVMF run it (KVM is on the runner);
          # minisign makes the other key the update of the agent must refuse (Z-504)
          sudo apt-get install -y -q incus incus-agent qemu-system-x86 ovmf minisign
          sudo incus admin init --minimal
          # Docker on the runner drops forwarded packets: let the VMs' bridge out, and answers back in
          if sudo iptables -n -L DOCKER-USER >/dev/null 2>&1; then
            sudo iptables -I DOCKER-USER -i incusbr0 -j ACCEPT
            sudo iptables -I DOCKER-USER -o incusbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          fi
      - name: VM
        run: |
          sudo incus launch "images:${{ matrix.system }}" "$VM" --vm -c limits.cpu=2 -c limits.memory=2GiB
          for i in $(seq 1 120); do sudo incus exec "$VM" -- true 2>/dev/null && break; sleep 2; done
          sudo incus exec "$VM" -- sh -c 'for i in $(seq 1 60); do getent hosts deb.debian.org >/dev/null && exit 0; sleep 2; done; exit 1'
      - name: Zentrale with the agent files
        run: |
          bun run --cwd apps/agent build
          # a link the update of the agent (Z-504) turns to a newer release in one step (rename)
          bun scripts/agent-dateien.ts "$RUNNER_TEMP/agent-0.0.0"
          ln -s "$RUNNER_TEMP/agent-0.0.0" "$RUNNER_TEMP/agent-dateien"
          host="$(sudo incus network get incusbr0 ipv4.address | cut -d/ -f1)"
          {
            echo "STEUERZENTRALE_PORT=28300"
            echo "STEUERZENTRALE_HOST=127.0.0.1"
            echo "STEUERZENTRALE_DATA=$RUNNER_TEMP/daten"
            echo "STEUERZENTRALE_SECRET_KEY=$(head -c 32 /dev/zero | tr '\0' '\7' | base64)"
            echo "STEUERZENTRALE_URL=http://localhost:28300"
            # agents reach the Zentrale only through its Pforte, as agent.<domain> in production
            echo "STEUERZENTRALE_AGENT_URL=https://$host:28443"
            echo "STEUERZENTRALE_AGENT_DATEIEN=$RUNNER_TEMP/agent-dateien"
            echo "PFORTE_HOST=$host"
          } >> "$GITHUB_ENV"
      - name: install.sh in the VM
        run: |
          nohup bun apps/zentrale/src/main.ts > "$RUNNER_TEMP/zentrale.log" 2>&1 &
          for i in $(seq 1 50); do curl -fsS "$STEUERZENTRALE_URL/health" && break; sleep 0.2; done
          neu="$(bun apps/zentrale/src/testhilfen/testserver.ts anlegen "${{ matrix.system }}")"
          echo "SERVER_ID=$(jq -r .serverId <<< "$neu")" >> "$GITHUB_ENV"
          # The Pforte in front of the Zentrale (testhilfen/ci-pforte.ts): TLS, the client certificate
          # checked against the operator's CA, its fingerprint passed on from loopback; the Zentrale
          # believes that header from nowhere else, so without it the agent's connection gets 401
          ca="$RUNNER_TEMP/pforte-ca.pem"
          nohup bun apps/zentrale/src/testhilfen/ci-pforte.ts "$PFORTE_HOST" 28443 "$ca" > "$RUNNER_TEMP/pforte.log" 2>&1 &
          for i in $(seq 1 50); do curl -fsS --cacert "$ca" "$STEUERZENTRALE_AGENT_URL/health" && break; sleep 0.2; done
          curl -fsS --cacert "$ca" "$STEUERZENTRALE_AGENT_URL/health"
          # The command needs curl, as the one the interface shows does
          sudo incus exec "$VM" -- sh -c 'command -v curl >/dev/null && command -v update-ca-certificates >/dev/null || { apt-get update -q && apt-get install -y -q curl ca-certificates; }'
          # The VM trusts the Pforte's test CA: curl through the system's store, the agent (Bun)
          # through NODE_EXTRA_CA_CERTS, in install.sh and in its service (also after its update)
          crt=/usr/local/share/ca-certificates/sz-test-pforte.crt
          sudo incus file push "$ca" "$VM$crt"
          sudo incus exec "$VM" -- update-ca-certificates
          printf '[Service]\nEnvironment=NODE_EXTRA_CA_CERTS=%s\n' "$crt" > "$RUNNER_TEMP/sz-test-pforte.conf"
          sudo incus file push --create-dirs "$RUNNER_TEMP/sz-test-pforte.conf" "$VM/etc/systemd/system/steuerzentrale-agent.service.d/sz-test-pforte.conf"
          sudo incus exec "$VM" --env NODE_EXTRA_CA_CERTS="$crt" -- sh -c "$(jq -r .befehl <<< "$neu")"
      - name: The agent runs and has its certificate
        run: |
          sudo incus exec "$VM" -- systemctl is-active steuerzentrale-agent
          sudo incus exec "$VM" -- podman --version
          test "$(sudo incus exec "$VM" -- sysctl -n net.ipv4.ip_unprivileged_port_start)" = 80
          # the Pforte's user (Z-401): rootless Podman needs subordinate ids, its units lingering
          sudo incus exec "$VM" -- id sz-pforte
          sudo incus exec "$VM" -- grep -q '^sz-pforte:' /etc/subuid
          test "$(sudo incus exec "$VM" -- loginctl show-user sz-pforte -p Linger --value)" = yes
          vm="$(sudo incus exec "$VM" -- sh -c "sed '1d;\$d' /var/lib/steuerzentrale/agent.pem | base64 -d | sha256sum | cut -d' ' -f1")"
          zentrale="$(bun apps/zentrale/src/testhilfen/testserver.ts fingerabdruck "$SERVER_ID")"
          echo "VM: $vm, Zentrale: $zentrale"
          test -n "$vm" && test "$vm" = "$zentrale"
          # the agent is connected: the Zentrale saw its hallo through the Pforte
          agent() { bun apps/zentrale/src/testhilfen/testserver.ts agent "$SERVER_ID"; }
          for i in $(seq 1 30); do test "$(agent | jq -r .version)" = 0.0.0 && break; sleep 2; done
          test "$(agent | jq -r .version)" = 0.0.0
      # Z-701: the VM needs a reboot (/run is a tmpfs, so the mark is gone after it, as after a real
      # kernel update); the agent, restarted, sends fresh facts; in the window opened for the whole
      # day the planning (every minute) reboots the server, which has no installation to back up.
      # Before the update of the agent: no reboot may meet its check timer, and the day's pause
      # after this one keeps any other away
      - name: The server reboots in its window and comes back
        run: |
          neustart() { bun apps/zentrale/src/testhilfen/testserver.ts neustart "$SERVER_ID"; }
          stand="$RUNNER_TEMP/neustart.json"
          vorher="$(sudo incus exec "$VM" -- cat /proc/sys/kernel/random/boot_id)"
          sudo incus exec "$VM" -- touch /var/run/reboot-required
          sudo incus exec "$VM" -- systemctl restart steuerzentrale-agent
          for i in $(seq 1 30); do neustart > "$stand"; test "$(jq -r .fakten.bootId "$stand")" = "$vorher" && test "$(jq -r .fakten.neustartNoetig "$stand")" = true && break; sleep 2; done
          jq . "$stand"
          test "$(jq -r .fakten.neustartNoetig "$stand")" = true
          bun apps/zentrale/src/testhilfen/testserver.ts wartungsfenster "$SERVER_ID"
          for i in $(seq 1 60); do neustart > "$stand"; test "$(jq -r .neustart.zustand "$stand")" = erfolgreich && break; sleep 5; done
          jq . "$stand"
          # the job named the boot of the facts and ended once the agent reported from another one
          test "$(jq -r .neustart.zustand "$stand")" = erfolgreich
          test "$(jq -r .neustart.argumente "$stand" | jq -r .bootId)" = "$vorher"
          jq -e '.ereignisse | any(.art == "server_neu_gestartet")' "$stand"
          # the VM really booted anew, without the mark, and its agent runs
          for i in $(seq 1 60); do sudo incus exec "$VM" -- true 2>/dev/null && break; sleep 2; done
          nachher="$(sudo incus exec "$VM" -- cat /proc/sys/kernel/random/boot_id)"
          echo "boot before: $vorher, after: $nachher"
          test -n "$nachher" && test "$nachher" != "$vorher"
          test "$(jq -r .neustart.ergebnis "$stand" | jq -r .daten.bootId)" = "$nachher"
          sudo incus exec "$VM" -- test ! -e /var/run/reboot-required
          sudo incus exec "$VM" -- systemctl is-active steuerzentrale-agent
          # connected again: the facts of the new boot and a heartbeat after the job's end
          ende="$(jq -r .neustart.geaendertAm "$stand")"
          verbunden() { test "$(jq -r .fakten.bootId "$stand")" = "$nachher" && test "$(jq -r '.letzterHeartbeat // 0' "$stand")" -gt "$ende"; }
          for i in $(seq 1 30); do neustart > "$stand"; verbunden && break; sleep 2; done
          jq . "$stand"
          verbunden
          test "$(jq -r .fakten.neustartNoetig "$stand")" = false
      # Z-504: a newer agent (0.0.1, the same code with another version, scripts/compile.ts) in the
      # agent files; the maintenance window is the whole day, the planning runs every minute
      - name: The agent updates itself
        run: |
          STEUERZENTRALE_BAU_VERSION=0.0.1 bun run --cwd apps/agent build
          bun scripts/agent-dateien.ts "$RUNNER_TEMP/agent-0.0.1"
          ln -sfn "$RUNNER_TEMP/agent-0.0.1" "$RUNNER_TEMP/agent-dateien.neu"
          mv -T "$RUNNER_TEMP/agent-dateien.neu" "$RUNNER_TEMP/agent-dateien"
          bun apps/zentrale/src/testhilfen/testserver.ts wartungsfenster "$SERVER_ID"
          agent() { bun apps/zentrale/src/testhilfen/testserver.ts agent "$SERVER_ID"; }
          for i in $(seq 1 60); do test "$(agent | jq -r .version)" = 0.0.1 && break; sleep 5; done
          agent | tee "$RUNNER_TEMP/agent.json"
          # the Zentrale saw the new agent's hallo, the job succeeded, the event says so
          test "$(jq -r .version "$RUNNER_TEMP/agent.json")" = 0.0.1
          test "$(jq -r .update.zustand "$RUNNER_TEMP/agent.json")" = erfolgreich
          jq -e '.ereignisse | any(.art == "agent_aktualisiert")' "$RUNNER_TEMP/agent.json"
          # the new binary runs as the service, the old one is kept beside it
          sudo incus exec "$VM" -- systemctl is-active steuerzentrale-agent
          test "$(sudo incus exec "$VM" -- /usr/local/bin/steuerzentrale-agent --version)" = "steuerzentrale-agent 0.0.1 (protokoll 1)"
          test "$(sudo incus exec "$VM" -- /usr/local/bin/steuerzentrale-agent.alt --version)" = "steuerzentrale-agent 0.0.0 (protokoll 1)"
          # the new agent confirmed itself at willkommen; the check from the old binary is planned
          bestaetigt() { sudo incus exec "$VM" -- grep -q '"bestaetigt":true' /var/lib/steuerzentrale/agent-update.json; }
          for i in $(seq 1 10); do bestaetigt && break; sleep 1; done
          bestaetigt
          sudo incus exec "$VM" -- systemctl is-active steuerzentrale-agent-pruefen.timer
          # the check, run now as its timer would: a confirmed update stays
          sudo incus exec "$VM" -- /usr/local/bin/steuerzentrale-agent.alt agent-update-pruefen
          sudo incus exec "$VM" -- test ! -e /var/lib/steuerzentrale/agent-update.json
          test "$(sudo incus exec "$VM" -- /usr/local/bin/steuerzentrale-agent --version)" = "steuerzentrale-agent 0.0.1 (protokoll 1)"
          sudo incus exec "$VM" -- systemctl is-active steuerzentrale-agent
      # Z-504: 0.0.2 with SHA256SUMS signed by a key the server does not trust: refused, nothing replaced
      - name: A wrong signature is refused
        run: |
          STEUERZENTRALE_BAU_VERSION=0.0.2 bun run --cwd apps/agent build
          bun scripts/agent-dateien.ts "$RUNNER_TEMP/agent-0.0.2"
          minisign -G -W -p "$RUNNER_TEMP/fremd.pub" -s "$RUNNER_TEMP/fremd.key"
          minisign -S -s "$RUNNER_TEMP/fremd.key" -m "$RUNNER_TEMP/agent-0.0.2/SHA256SUMS" < /dev/null
          ln -sfn "$RUNNER_TEMP/agent-0.0.2" "$RUNNER_TEMP/agent-dateien.neu"
          mv -T "$RUNNER_TEMP/agent-dateien.neu" "$RUNNER_TEMP/agent-dateien"
          agent() { bun apps/zentrale/src/testhilfen/testserver.ts agent "$SERVER_ID"; }
          for i in $(seq 1 60); do test "$(agent | jq -r '.update | "\(.version) \(.zustand)"')" = "0.0.2 gescheitert" && break; sleep 5; done
          agent | tee "$RUNNER_TEMP/agent.json"
          test "$(jq -r .update.zustand "$RUNNER_TEMP/agent.json")" = gescheitert
          jq -r .update.ergebnis "$RUNNER_TEMP/agent.json" | grep -q "the signature of SHA256SUMS does not hold"
          jq -e '.ereignisse | any(.art == "agent_update_gescheitert")' "$RUNNER_TEMP/agent.json"
          # the agent still runs 0.0.1 and wrote nothing of 0.0.2
          test "$(jq -r .version "$RUNNER_TEMP/agent.json")" = 0.0.1
          sudo incus exec "$VM" -- systemctl is-active steuerzentrale-agent
          test "$(sudo incus exec "$VM" -- /usr/local/bin/steuerzentrale-agent --version)" = "steuerzentrale-agent 0.0.1 (protokoll 1)"
          sudo incus exec "$VM" -- test ! -e /usr/local/bin/steuerzentrale-agent.neu
          sudo incus exec "$VM" -- test ! -e /var/lib/steuerzentrale/agent-update.json
      # Z-1002 (docs/zentrale-sichern.md): the Zentrale backs up its database while it runs, restic
      # takes the file to an S3 target (the test MinIO of the agent's backup tests), the key stays
      # apart; then a "new server": the Zentrale and its Pforte stopped, the backup restored from
      # restic into an empty data directory, both started there on the same address. The agent,
      # whose certificate chains to the restored CA, connects again and sends heartbeats; the server
      # and its events are there
      - name: The Zentrale is backed up and restored on a new server
        run: |
          minio="$(bun --print 'require("./apps/agent/test/backup-hilfen.ts").MINIO_IMAGE')"
          restic_image="$(bun --print 'require("./packages/manifest/src/system.ts").RESTIC_IMAGE.image')"
          s3_geheim="sz-test-$(head -c 12 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9')"
          podman run -d --rm --name sz-test-zentrale-s3 -p 127.0.0.1:29402:9000 \
            -e MINIO_ROOT_USER=sztest -e MINIO_ROOT_PASSWORD="$s3_geheim" -e MINIO_DEFAULT_BUCKETS=zentrale "$minio"
          for i in $(seq 1 120); do curl -fsS http://127.0.0.1:29402/minio/health/ready && break; sleep 1; done
          head -c 32 /dev/urandom | base64 > "$RUNNER_TEMP/restic-passwort"
          export AWS_ACCESS_KEY_ID=sztest AWS_SECRET_ACCESS_KEY="$s3_geheim"
          restic() {
            podman run --rm --network host -v "$RUNNER_TEMP/restic-passwort:/passwort:ro" \
              -v "$RUNNER_TEMP/sicherung:/sicherung" -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY \
              -e RESTIC_PASSWORD_FILE=/passwort "$restic_image" --no-cache \
              --repo s3:http://127.0.0.1:29402/zentrale/steuerzentrale "$@"
          }
          mkdir -p "$RUNNER_TEMP/sicherung"
          # the Zentrale runs on while it backs up
          bun apps/zentrale/src/main.ts sichern "$RUNNER_TEMP/sicherung/zentrale.sicherung.db"
          curl -fsS "$STEUERZENTRALE_URL/health"
          restic init
          restic backup --host steuerzentrale /sicherung
          # the snapshot holds the database alone, and never the key
          restic ls latest | tee "$RUNNER_TEMP/restic-ls.txt"
          test "$(grep -c '^/sicherung/' "$RUNNER_TEMP/restic-ls.txt")" = 1
          grep -qx /sicherung/zentrale.sicherung.db "$RUNNER_TEMP/restic-ls.txt"
          restic dump latest /sicherung/zentrale.sicherung.db > "$RUNNER_TEMP/dump.db"
          test -s "$RUNNER_TEMP/dump.db"
          if grep -aqF "$STEUERZENTRALE_SECRET_KEY" "$RUNNER_TEMP/dump.db"; then echo "the key is in the backup"; exit 1; fi
          vorher="$(bun apps/zentrale/src/testhilfen/testserver.ts fingerabdruck "$SERVER_ID")"

          # the old server is gone: Zentrale and Pforte stopped, its data directory with them
          pkill -f 'apps/zentrale/src/main.ts' || true
          pkill -f 'testhilfen/ci-pforte.ts' || true
          for i in $(seq 1 50); do pgrep -f 'apps/zentrale/src/main.ts|testhilfen/ci-pforte.ts' >/dev/null || break; sleep 0.2; done
          if curl -fsS "$STEUERZENTRALE_URL/health"; then echo "the old Zentrale still answers"; exit 1; fi
          mv "$RUNNER_TEMP/daten" "$RUNNER_TEMP/daten.alter-server"
          rm -rf "$RUNNER_TEMP/sicherung"
          mkdir -p "$RUNNER_TEMP/sicherung"

          # the new server: the backup from restic, the key brought apart, an empty data directory
          export STEUERZENTRALE_DATA="$RUNNER_TEMP/daten-neu"
          echo "STEUERZENTRALE_DATA=$STEUERZENTRALE_DATA" >> "$GITHUB_ENV"
          restic restore latest --target /
          bun apps/zentrale/src/main.ts wiederherstellen "$RUNNER_TEMP/sicherung/zentrale.sicherung.db"
          wiederhergestellt="$(date +%s%3N)"
          nohup bun apps/zentrale/src/main.ts > "$RUNNER_TEMP/zentrale-neu.log" 2>&1 &
          for i in $(seq 1 50); do curl -fsS "$STEUERZENTRALE_URL/health" && break; sleep 0.2; done
          ca="$RUNNER_TEMP/pforte-ca.pem"
          nohup bun apps/zentrale/src/testhilfen/ci-pforte.ts "$PFORTE_HOST" 28443 "$ca" > "$RUNNER_TEMP/pforte-neu.log" 2>&1 &
          for i in $(seq 1 50); do curl -fsS --cacert "$ca" "$STEUERZENTRALE_AGENT_URL/health" && break; sleep 0.2; done

          # the server with its certificate's fingerprint and its events came back
          test "$(bun apps/zentrale/src/testhilfen/testserver.ts fingerabdruck "$SERVER_ID")" = "$vorher"
          stand="$RUNNER_TEMP/wiederhergestellt.json"
          bun apps/zentrale/src/testhilfen/testserver.ts neustart "$SERVER_ID" > "$stand"
          jq -e '.ereignisse | any(.art == "server_neu_gestartet")' "$stand"
          # the agent connects again with its certificate and sends heartbeats after the restore
          verbunden() { test "$(jq -r '.letzterHeartbeat // 0' "$stand")" -gt "$wiederhergestellt"; }
          for i in $(seq 1 60); do bun apps/zentrale/src/testhilfen/testserver.ts neustart "$SERVER_ID" > "$stand"; verbunden && break; sleep 5; done
          jq . "$stand"
          verbunden
          sudo incus exec "$VM" -- systemctl is-active steuerzentrale-agent
      - if: failure()
        run: |
          cat "$RUNNER_TEMP/zentrale.log" || true
          cat "$RUNNER_TEMP/pforte.log" || true
          cat "$RUNNER_TEMP/neustart.json" || true
          cat "$RUNNER_TEMP/zentrale-neu.log" || true
          cat "$RUNNER_TEMP/pforte-neu.log" || true
          podman logs sz-test-zentrale-s3 || true
          sudo incus exec "$VM" -- journalctl -u steuerzentrale-agent --no-pager -n 100 || true
          sudo incus exec "$VM" -- journalctl -u steuerzentrale-agent-pruefen --no-pager -n 50 || true

  # BAULISTE.md Z-1004: the release candidate. The Zentrale's image for amd64 and arm64 (only COPY,
  # so no emulation), pushed only to a local registry on the runner; the agent files with SHA256SUMS
  # and the image's archive, signed with the public test key; all of it as workflow artifact. Then
  # docs/installation.md in an Incus VM (Debian 13), Zentrale, Pforte and agent on one server, with
  # the test's differences only: the image from the runner's registry over HTTP, the agent files
  # signed with the test key (install.sh --testmodus), certificates from Caddy's local CA instead of
  # ACME (`--intern`), the interface reached from the runner instead of over WireGuard. No tag, no
  # real key, no push anywhere else: that is a person's (BAULISTE.md, "Schritte für Menschen")
  release-kandidat:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VM: sz-test-zentrale
      UI_HOST: zentrale.sz-test.internal
      AGENT_HOST: agent.sz-test.internal
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: sudo apt-get install -y -q minisign
      - run: bun run build
      # The local registry of the tests (CNCF distribution 3.0.0 by digest: registry-1.docker.io,
      # library/registry, tag 3.0.0, queried 2026-11-23 with scripts/digest.ts), in the host's
      # network so the VM reaches it on the bridge
      - name: Image for amd64 and arm64 in the local registry
        run: |
          podman run -d --rm --name sz-test-registry --network host -e REGISTRY_HTTP_ADDR=0.0.0.0:5000 \
            docker.io/library/registry@sha256:6c5666b861f3505b116bb9aa9b25175e71210414bd010d92035ff64018f9457e
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5000/v2/ && break; sleep 1; done
          kontext="$RUNNER_TEMP/kontext"
          bun scripts/release-kandidat.ts kontext "$kontext"
          podman build --platform linux/amd64,linux/arm64 --manifest localhost/steuerzentrale:kandidat \
            -f "$kontext/Containerfile" "$kontext"
          podman manifest push --all --tls-verify=false --digestfile "$RUNNER_TEMP/digest" \
            localhost/steuerzentrale:kandidat docker://localhost:5000/steuerzentrale:kandidat
          digest="$(cat "$RUNNER_TEMP/digest")"
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          # one image per architecture behind the digest
          skopeo inspect --raw --tls-verify=false "docker://localhost:5000/steuerzentrale@$digest" |
            jq -e '[.manifests[].platform.architecture] | sort == ["amd64", "arm64"]'
      - name: Release candidate, signed with the test key
        run: |
          a="$RUNNER_TEMP/release-kandidat"
          mkdir -p "$a"
          bun scripts/agent-dateien.ts "$a/agent-dateien"
          skopeo copy --all --src-tls-verify=false "docker://localhost:5000/steuerzentrale@$DIGEST" \
            "oci-archive:$a/steuerzentrale-image.tar"
          bun scripts/release-kandidat.ts unit "ghcr.io/speicherstadt/steuerzentrale@$DIGEST" "$a/quadlet"
          echo "$DIGEST" > "$a/DIGEST"
          bun scripts/release-kandidat.ts signieren "$a" steuerzentrale-image.tar quadlet/steuerzentrale.container DIGEST
          # both signatures hold, and a release build refuses the key they were made with
          for d in "$a" "$a/agent-dateien"; do
            (cd "$d" && minisign -Vm SHA256SUMS -p minisign.pub && sha256sum -c SHA256SUMS)
          done
          if bun scripts/release-schluessel.ts "$a/minisign.pub"; then echo "a release took the test key"; exit 1; fi
          ls -lR "$a"
      - uses: actions/upload-artifact@v5
        with:
          name: release-kandidat
          path: ${{ runner.temp }}/release-kandidat
          retention-days: 14
      - name: Incus
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q incus incus-agent qemu-system-x86 ovmf
          sudo incus admin init --minimal
          if sudo iptables -n -L DOCKER-USER >/dev/null 2>&1; then
            sudo iptables -I DOCKER-USER -i incusbr0 -j ACCEPT
            sudo iptables -I DOCKER-USER -o incusbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          fi
      - name: VM
        run: |
          sudo incus launch images:debian/13 "$VM" --vm -c limits.cpu=2 -c limits.memory=3GiB
          for i in $(seq 1 120); do sudo incus exec "$VM" -- true 2>/dev/null && break; sleep 2; done
          sudo incus exec "$VM" -- sh -c 'for i in $(seq 1 60); do getent hosts deb.debian.org >/dev/null && exit 0; sleep 2; done; exit 1'
          host="$(sudo incus network get incusbr0 ipv4.address | cut -d/ -f1)"
          echo "BRUECKE=$host" >> "$GITHUB_ENV"
          echo "VM_IP=$(sudo incus list "$VM" -c 4 -f csv | grep -o '^[0-9.]*' | head -1)" >> "$GITHUB_ENV"
      # docs/installation.md, steps 1 to 6, as written there; the differences of the test are named
      - name: The Zentrale as docs/installation.md says
        run: |
          vm() { sudo incus exec "$VM" -- "$@"; }
          a="$RUNNER_TEMP/release-kandidat"
          # 1. packages
          vm sh -c 'apt-get update -q && apt-get install -y -q podman curl ca-certificates minisign jq'
          # (test) the runner's registry over HTTP, the hosts on this VM
          printf '[[registry]]\nlocation = "%s:5000"\ninsecure = true\n' "$BRUECKE" > "$RUNNER_TEMP/registry.conf"
          sudo incus file push --create-dirs "$RUNNER_TEMP/registry.conf" "$VM/etc/containers/registries.conf.d/sz-test-registry.conf"
          vm sh -c "printf '127.0.0.1 $UI_HOST $AGENT_HOST\n' >> /etc/hosts"
          # 2. users and ports
          vm sh -c 'printf "net.ipv4.ip_unprivileged_port_start=80\n" > /etc/sysctl.d/90-steuerzentrale.conf && sysctl -q -p /etc/sysctl.d/90-steuerzentrale.conf'
          vm useradd --create-home --home-dir /home/sz-zentrale --shell /usr/sbin/nologin --comment "Zentrale der Steuerzentrale" sz-zentrale
          vm useradd --create-home --home-dir /home/sz-pforte --shell /usr/sbin/nologin --comment "Pforte der Steuerzentrale" sz-pforte
          vm loginctl enable-linger sz-zentrale
          vm loginctl enable-linger sz-pforte
          for u in sz-zentrale sz-pforte; do
            vm sh -c "for i in \$(seq 1 30); do test -d /run/user/\$(id -u $u) && exit 0; sleep 1; done; exit 1"
          done
          # 3. agent files, checked against the key (the test key here, the release key in production)
          sudo incus file push -r "$a/agent-dateien" "$VM/home/sz-zentrale/"
          vm chmod -R a+rX /home/sz-zentrale/agent-dateien
          vm sh -c 'cd /home/sz-zentrale/agent-dateien && minisign -Vm SHA256SUMS -p minisign.pub && sha256sum -c SHA256SUMS'
          # 4. the key as a Podman secret, the addresses, the unit (image from the runner's registry)
          printf 'STEUERZENTRALE_URL=https://%s\nSTEUERZENTRALE_AGENT_URL=https://%s\n' "$UI_HOST" "$AGENT_HOST" > "$RUNNER_TEMP/steuerzentrale.env"
          sudo incus file push "$RUNNER_TEMP/steuerzentrale.env" "$VM/home/sz-zentrale/steuerzentrale.env"
          bun scripts/release-kandidat.ts unit "$BRUECKE:5000/steuerzentrale@$DIGEST" "$RUNNER_TEMP/quadlet-vm"
          sudo incus file push --create-dirs "$RUNNER_TEMP/quadlet-vm/steuerzentrale.container" "$VM/home/sz-zentrale/.config/containers/systemd/steuerzentrale.container"
          vm sh -c 'chown -R sz-zentrale: /home/sz-zentrale && chmod 600 /home/sz-zentrale/steuerzentrale.env'
          als='als() ( u="$1"; shift; uid="$(id -u "$u")"; cd / && runuser -u "$u" -- env -i HOME="$(getent passwd "$u" | cut -d: -f6)" XDG_RUNTIME_DIR="/run/user/$uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" PATH=/usr/local/bin:/usr/bin:/bin "$@"; )'
          echo "ALS=$als" >> "$GITHUB_ENV"
          vm bash -c "$als; head -c 32 /dev/urandom | base64 | als sz-zentrale podman secret create steuerzentrale-secret-key -"
          # 5. start, /health on loopback
          vm bash -c "$als; als sz-zentrale systemctl --user daemon-reload && als sz-zentrale systemctl --user start steuerzentrale"
          vm sh -c 'for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8300/health && exit 0; sleep 2; done; exit 1'
          # 6. the Pforte: its unit from the Zentrale, then the Zentrale's routes into it
          vm bash -c "$als; als sz-zentrale podman exec steuerzentrale steuerzentrale pforte-unit > /root/sz-pforte.container"
          vm sh -c 'install -D -o sz-pforte -g sz-pforte -m 0644 /root/sz-pforte.container /home/sz-pforte/.config/containers/systemd/sz-pforte.container && chown -R sz-pforte: /home/sz-pforte/.config'
          vm bash -c "$als; als sz-pforte systemctl --user daemon-reload && als sz-pforte systemctl --user start sz-pforte"
          vm sh -c 'for i in $(seq 1 120); do test -S /home/sz-pforte/pforte/admin.sock && exit 0; sleep 2; done; exit 1'
          # (test) the interface from the runner's bridge address, not over WireGuard; certificates from Caddy's local CA
          echo "NETZ=$BRUECKE/32" >> "$GITHUB_ENV"
          pforte_laden="$als; sock=/home/sz-pforte/pforte/admin.sock; curl -fsS --unix-socket \$sock http://localhost/config/ | als sz-zentrale podman exec -i steuerzentrale steuerzentrale pforte $BRUECKE/32 --intern > /root/pforte.json && curl -fsS --unix-socket \$sock -H 'content-type: application/json' --data-binary @/root/pforte.json http://localhost/load"
          echo "PFORTE_LADEN=$pforte_laden" >> "$GITHUB_ENV"
          vm bash -c "$pforte_laden"
      - name: The first owner, a server, its agent
        run: |
          vm() { sudo incus exec "$VM" -- "$@"; }
          # the CA of Caddy's local issuer (test only): for the runner, the VM's curl and the agent
          ca="$RUNNER_TEMP/pforte-ca.pem"
          for i in $(seq 1 30); do vm bash -c "$ALS; als sz-pforte podman exec sz-pforte cat /data/caddy/pki/authorities/local/root.crt" > "$ca" 2>/dev/null && test -s "$ca" && break; sleep 2; done
          test -s "$ca"
          echo "$VM_IP $UI_HOST $AGENT_HOST" | sudo tee -a /etc/hosts
          export NODE_EXTRA_CA_CERTS="$ca"
          curl -fsS --cacert "$ca" "https://$UI_HOST/health"
          # the interface is served by the image, and agent.<domain> opens only the agent's paths
          curl -fsS --cacert "$ca" "https://$UI_HOST/erster-inhaber" | grep -qi '<!doctype html>'
          # the setup code for the first owner is in the Zentrale's log, once
          uid="$(vm id -u sz-zentrale)"
          for i in $(seq 1 30); do
            code="$(vm journalctl _UID="$uid" -o cat --no-pager | grep -m1 '"setup code for the first owner"' | jq -r .code || true)"
            test -n "$code" && break; sleep 2
          done
          test -n "$code"
          kekse="$RUNNER_TEMP/kekse.json"
          neu="$(bun apps/zentrale/src/testhilfen/erster-server.ts "https://$UI_HOST" "$kekse" einrichten "$code")"
          echo "SERVER_ID=$(jq -r .serverId <<< "$neu")" >> "$GITHUB_ENV"
          # 7. with an operator there is a CA: the Pforte again, now with agent.<domain>
          vm bash -c "$PFORTE_LADEN"
          for i in $(seq 1 30); do curl -fsS --cacert "$ca" "https://$AGENT_HOST/health" && break; sleep 2; done
          test "$(curl -s -o /dev/null -w '%{http_code}' --cacert "$ca" "https://$AGENT_HOST/api/v1/ich")" = 404
          # 8. the install command on the same server (the test key: --testmodus; the VM trusts the test CA)
          crt=/usr/local/share/ca-certificates/sz-test-pforte.crt
          sudo incus file push "$ca" "$VM$crt"
          vm update-ca-certificates
          printf '[Service]\nEnvironment=NODE_EXTRA_CA_CERTS=%s\n' "$crt" > "$RUNNER_TEMP/sz-test-pforte.conf"
          sudo incus file push --create-dirs "$RUNNER_TEMP/sz-test-pforte.conf" "$VM/etc/systemd/system/steuerzentrale-agent.service.d/sz-test-pforte.conf"
          befehl="$(jq -r .befehl <<< "$neu" | sed 's/| sudo sh -s --/| sh -s --/') --testmodus"
          echo "$befehl"
          sudo incus exec "$VM" --env NODE_EXTRA_CA_CERTS="$crt" -- sh -c "$befehl"
          vm systemctl is-active steuerzentrale-agent
          # the agent joined and is connected, as the interface shows it
          stand() { bun apps/zentrale/src/testhilfen/erster-server.ts "https://$UI_HOST" "$kekse" server "$SERVER_ID"; }
          for i in $(seq 1 30); do test "$(stand | jq -r .agent.zustand)" = verbunden && break; sleep 2; done
          stand | tee "$RUNNER_TEMP/server.json"
          test "$(jq -r .agent.zustand "$RUNNER_TEMP/server.json")" = verbunden
          test "$(jq -r .agentVersion "$RUNNER_TEMP/server.json")" = "$(cat "$RUNNER_TEMP/release-kandidat/agent-dateien/VERSION")"
          # the Zentrale stops at once on SIGTERM (PID 1 of its container) and comes back after a reboot
          vm bash -c "$ALS; s=\$(date +%s); als sz-zentrale systemctl --user stop steuerzentrale; test \$(( \$(date +%s) - s )) -lt 8"
          timeout 60 sudo incus exec "$VM" -- systemctl reboot || true
          sleep 10
          for i in $(seq 1 120); do vm true 2>/dev/null && break; sleep 2; done
          vm sh -c 'for i in $(seq 1 90); do curl -fsS http://127.0.0.1:8300/health && exit 0; sleep 2; done; exit 1'
          for i in $(seq 1 60); do test "$(stand | jq -r .agent.zustand)" = verbunden && break; sleep 3; done
          test "$(stand | jq -r .agent.zustand)" = verbunden
      - if: failure()
        run: |
          vm() { sudo incus exec "$VM" -- "$@"; }
          vm journalctl --no-pager -n 200 || true
          vm bash -c "$ALS; als sz-zentrale systemctl --user status steuerzentrale --no-pager; als sz-pforte systemctl --user status sz-pforte --no-pager" || true
          vm cat /root/pforte.json || true
          vm journalctl -u steuerzentrale-agent --no-pager -n 100 || true

  # One result for the rules on main (required check "check"), however many parts the jobs split into
  check:
    if: ${{ always() && !github.event.pull_request.draft }}
    needs: [changes, unit, agent, e2e, server, release-kandidat]
    runs-on: ubuntu-latest
    steps:
      # A part may be skipped only when the pull request changes no code (job changes); otherwise every
      # part must have run and passed
      - env:
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          for result in "${{ needs.unit.result }}" "${{ needs.agent.result }}" "${{ needs.e2e.result }}" "${{ needs.server.result }}" "${{ needs.release-kandidat.result }}"; do
            if [ "$result" = success ]; then continue; fi
            if [ "$result" = skipped ] && [ "$CODE" = false ]; then continue; fi
            echo "A part ended with: $result"
            exit 1
          done
