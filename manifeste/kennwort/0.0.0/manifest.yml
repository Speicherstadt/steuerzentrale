# Kennwort 0.0.0 for the Steuerzentrale (Z-203). The source of every value: QUELLEN.md next to this file.
schema: 1
id: kennwort
version: 0.0.0
lizenz: AGPL-3.0-only
quelle: https://github.com/Speicherstadt/kennwort
container:
  - name: app
    image:
      noch_nicht_veroeffentlicht: >-
        Kennwort hat noch kein Image (Bauliste von Kennwort, K-703 offen); auf GHCR gibt es keines
        (scripts/digest.ts, 2026-11-20)
    volumes:
      - { name: daten, pfad: /daten }
    env: [KENNWORT_PUBLIC_URL, KENNWORT_AUTH_SECRET, KENNWORT_SETUP_CODE]
    feste_env:
      KENNWORT_PORT: "8100"
      KENNWORT_DATABASE: /daten/kennwort.db
      KENNWORT_BEHIND_PROXY: "true"
architektur: [amd64, arm64]
ressourcen: { ram_mb: 512, platte_gb: 1 }
netz:
  http: { dienst: app, port: 8100, websocket: false, sse: false }
  ports: []
  oeffentliche_ipv4: false
  mail: false
  server_fuer_sich: false
proxy: geteilt
rootful: false
optionen: []
braucht: []
bietet: []
anmeldung: eigen
health: { art: http, dienst: app, pfad: /health }
befehle: {}
schritte: { einrichten: [], nach_update: [] }
backup:
  - { art: volume, volume: daten }
aktionen:
  nur_lesen: nicht_unterstuetzt
  export: nicht_unterstuetzt
sperrzeiten: []
dns: []
env:
  - { name: KENNWORT_PUBLIC_URL, ebene: auto, aus: adresse }
  - { name: KENNWORT_AUTH_SECRET, ebene: auto, typ: geheim, erzeugen: zufall_32 }
  - name: KENNWORT_SETUP_CODE
    ebene: installation
    typ: geheim
    pflicht: true
    beschreibung: Code, mit dem der erste Inhaber die Firma anlegt (mindestens 16 Zeichen)
hinweis: Kennwort ist Open Source (AGPL), https://github.com/Speicherstadt/kennwort
