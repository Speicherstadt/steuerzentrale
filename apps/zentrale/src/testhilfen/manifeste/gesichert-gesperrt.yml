# Test manifest for restoring in a freeze window (Z-603), signed with the public test key (test/schluessel/):
# minisign -S -s test/schluessel/test.key -m gesichert-gesperrt.yml -t "probe 1.0.0 gesichert-gesperrt (test key)"
# The manifest gesichert.yml with the freeze window of gesperrt.yml (the 7th to the 12th of every month).
schema: 1
id: probe
version: 1.0.0
lizenz: AGPL-3.0-only
quelle: https://example.org/probe
container:
  - name: app
    image: registry.example.org/probe@sha256:1111111111111111111111111111111111111111111111111111111111111111
    volumes: [{ name: daten, pfad: /daten }]
    env: [PROBE_LIZENZ, PROBE_TITEL, PROBE_KENNWORT, PROBE_SCHLUESSEL, PROBE_PASSWORT]
architektur: [amd64, arm64]
ressourcen: { ram_mb: 256, platte_gb: 1 }
netz:
  http: { dienst: app, port: 8080 }
  ports: [{ dienst: app, port: 9000, proto: tcp, fest: false }]
anmeldung: eigen
health: { art: http, dienst: app, pfad: /health }
befehle:
  migrieren: { container: app, argv: [migrieren] }
  sichern: { container: app, argv: [sichern] }
schritte: { einrichten: [migrieren] }
aktionen: { nur_lesen: nicht_unterstuetzt, export: nicht_unterstuetzt }
env:
  - { name: PROBE_LIZENZ, ebene: betreiber, typ: geheim, pflicht: true }
  - { name: PROBE_TITEL, ebene: installation, vorgabe: Probe }
  - { name: PROBE_KENNWORT, ebene: installation, typ: geheim }
  - { name: PROBE_SCHLUESSEL, ebene: auto, erzeugen: zufall_32 }
  - { name: PROBE_PASSWORT, ebene: auto, erzeugen: zufall_hex_32 }
backup:
  - { art: volume, volume: daten }
  - { art: befehl, befehl: sichern }
sperrzeiten: [{ monatlich: "07-12", grund: Umsatzsteuer-Voranmeldung }]
